<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Luiz Henrique Francisco da Conceição  Founder and CTO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0d1f33"/>
      <stop offset="100%" stop-color="#0b3a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="88%" r="38%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glow2)"/>
  <rect x="1.5" y="1.5" width="1197" height="377" rx="26.5" fill="none" stroke="#1e3a4c" stroke-width="3"/>

  <!-- grid -->
  <g opacity="0.18" stroke="#94a3b8" stroke-width="1">
    <path d="M80 0 V380 M160 0 V380 M240 0 V380 M320 0 V380 M400 0 V380 M480 0 V380 M560 0 V380 M640 0 V380 M720 0 V380 M800 0 V380 M880 0 V380 M960 0 V380 M1040 0 V380 M1120 0 V380"/>
    <path d="M0 76 H1200 M0 152 H1200 M0 228 H1200 M0 304 H1200"/>
  </g>

  <!-- mark -->
  <g transform="translate(64,52)">
    <rect width="72" height="72" rx="18" fill="#042f2e"/>
    <rect x="1" y="1" width="70" height="70" rx="17" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="36" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#99f6e4">LH</text>
  </g>

  <text x="160" y="82" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3.2" fill="#5eead4">VÉRTICE · FOUNDER &amp; CTO</text>
  <text x="160" y="132" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#f8fafc">Luiz Henrique Francisco</text>
  <text x="160" y="176" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#f8fafc">da Conceição</text>
  <text x="160" y="218" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#94a3b8">Full Stack &amp; Mobile · produtos em produção no iOS, Android e Web</text>

  <!-- product pills -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">
    <rect x="160" y="250" width="168" height="42" rx="21" fill="#042f2e" stroke="#14b8a6"/>
    <text x="244" y="277" text-anchor="middle" fill="#ccfbf1">PagPegue</text>
    <rect x="344" y="250" width="168" height="42" rx="21" fill="#042f2e" stroke="#38bdf8"/>
    <text x="428" y="277" text-anchor="middle" fill="#e0f2fe">Condo360</text>
    <rect x="528" y="250" width="142" height="42" rx="21" fill="#042f2e" stroke="#f59e0b"/>
    <text x="599" y="277" text-anchor="middle" fill="#fef3c7">LarZin</text>
  </g>

  <text x="160" y="332" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#64748b">Rio de Janeiro, Brasil · offline-first · pagamentos · SaaS multi-tenant</text>

  <!-- orbit -->
  <g transform="translate(980,190)" fill="none" stroke="#22d3ee" stroke-opacity="0.35">
    <circle r="86" stroke-width="1.5"/>
    <circle r="58" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="28" stroke-width="2" stroke="#14b8a6" stroke-opacity="0.9"/>
    <circle cx="58" cy="-34" r="6" fill="#38bdf8" stroke="none"/>
    <circle cx="-48" cy="40" r="5" fill="#14b8a6" stroke="none"/>
    <circle cx="18" cy="72" r="4" fill="#f59e0b" stroke="none"/>
  </g>
</svg>
